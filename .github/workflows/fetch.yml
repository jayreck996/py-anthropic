name: Fetch Claude Article

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Full HTTPS claude.com/resources/articles/<slug> URL to fetch"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch article
        env:
          ARTICLE_URL: ${{ github.event.inputs.url }}
        shell: bash
        run: python fetch.py "$ARTICLE_URL" | tee result.json

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: article-${{ github.run_id }}
          path: result.json
          retention-days: 7
