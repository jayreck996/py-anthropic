<script>self.__next_f.push([1,"0:[\"$\", \"div\", null, {\"className\": \"text-rich-text text-rich-text--article w-richtext\", \"style\": \"$undefined\", \"children\": [[\"$\", \"p\", \"454a509cd156\", {\"className\": \"$undefined\", \"children\": [\"Over the past few months, we’ve seen a resurgence of always-on agents.\"]}], [\"$\", \"p\", \"e31677c0f175\", {\"className\": \"$undefined\", \"children\": [\"Always-on agents are stateful and proactive, meaning they manage context across sessions and take actions without direct supervision. Underneath, they run on the same \", [\"$\", \"$L3f\", \"7e14a6ff16fb\", {\"value\": {\"_key\": \"93aeae920952\", \"_type\": \"link\", \"href\": \"https://www.anthropic.com/research/building-effective-agents\"}, \"children\": [\"core loop\"]}], \" as other agents. The difference is the surrounding architecture, which is built from primitives that control when the agents wake up, what carries over between runs, and how their work reaches the user.\"]}], [\"$\", \"p\", \"c779ace43d95\", {\"className\": \"$undefined\", \"children\": [\"The resurgence is largely due to recent model advancements, which have made always-on agents more practical to run. First, the latest models have better judgment: they’re more reliable at understanding user intent and knowing when to check in. Second, intelligence is becoming cheaper, with long-horizon tasks benefiting the most. For example, on \", [\"$\", \"$L3f\", \"8343f1acf390\", {\"value\": {\"_key\": \"ca10bf339c50\", \"_type\": \"link\", \"href\": \"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"}, \"children\": [\"one long-horizon coding benchmark\"]}], \", Opus 5.5 cost 78% less per solved task than Opus 5, compared with 40% less on typical workloads.\"]}], [\"$\", \"p\", \"1e346ea0128f\", {\"className\": \"$undefined\", \"children\": [\"Customers have started to ask us how to integrate this type of experience into their own products. Some companies want to make their existing agents more proactive, while others are looking to build them from the ground up.\"]}], [\"$\", \"p\", \"45cbc97a0fc8\", {\"className\": \"$undefined\", \"children\": [\"This post breaks down the primitives behind always-on agents and walks through how they fit together.\"]}], [\"$\", \"h2\", \"86a5b1635711\", {\"className\": \"$undefined\", \"id\": \"the-cycle-behind-the-always-on-agent\", \"children\": [\"The cycle behind the always-on agent\"]}], [\"$\", \"p\", \"4486cc9f4496\", {\"className\": \"$undefined\", \"children\": [\"An always-on agent is not actually “always on.” This is just a description of the user experience.\"]}], [\"$\", \"p\", \"5cef910a7c59\", {\"className\": \"$undefined\", \"children\": [\"In reality, the agent spends most of its time asleep, waking up periodically to do work. Each stretch of work is called a \", [\"$\", \"strong\", \"e844521d5ef3\", {\"children\": [\"run\"]}], \": the agent receives an event, completes its task, and then saves information about what happened. A run works inside a \", [\"$\", \"strong\", \"cfe9b6953403\", {\"children\": [\"session\"]}], \", which is the transcript of messages and tool calls. Once the run is finished, the agent goes back to sleep, and the cycle repeats indefinitely.\"]}], [\"$\", \"figure\", \"40c213c4ee28\", {\"style\": {\"--media-natural-width\": \"1200px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/5dc803bf06d6e92e4aecae762da096626e2fa9ec.gif\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1200, \"height\": 675, \"alt\": \"Animated diagram of an always-on agent’s timeline: long stretches asleep with no tokens spent, broken by brief runs. Each run has four steps: an event arrives, a session starts, the agent loop runs, and the run writes back to stored state that carries over between runs.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}], \"$L40\", \"$L41\", \"$L42\", \"$L43\", \"$L44\", \"$L45\", \"$L46\", \"$L47\", \"$L48\", \"$L49\", \"$L4a\", \"$L4b\", \"$L4c\", \"$L4d\", \"$L4e\", \"$L4f\", \"$L50\", \"$L51\", \"$L52\", \"$L53\", \"$L54\", \"$L55\", \"$L56\", \"$L57\", \"$L58\", \"$L59\", \"$L5a\", \"$L5b\", \"$L5c\", \"$L5d\", \"$L5e\", \"$L5f\", \"$L60\", \"$L61\", \"$L62\", \"$L63\", \"$L64\", \"$L65\", \"$L66\", \"$L67\", \"$L68\", \"$L69\", \"$L6a\", \"$L6b\", \"$L6c\", \"$L6d\", \"$L6e\", \"$L6f\", \"$L70\", \"$L71\", \"$L72\", \"$L73\", \"$L74\"]}]\n40:[\"$\", \"h2\", \"0ae7d0bf0e8b\", {\"className\": \"$undefined\", \"id\": \"the-core-primitives\", \"children\": [\"The core primitives\"]}]\n41:[\"$\", \"p\", \"74e3724dea08\", {\"className\": \"$undefined\", \"children\": [\"The surrounding architecture of an always-on agent has five core primitives: an event inbox, timers, memory, permissions, and an outbox. Let’s take a look at each.\"]}]\n42:[\"$\", \"h3\", \"84a408deb24f\", {\"className\": \"$undefined\", \"children\": [\"Event inbox\"]}]\n43:[\"$\", \"p\", \"daf12e5502ae\", {\"className\": \"$undefined\", \"children\": [\"Most AI agents only run when the user sends a message. In contrast, always-on agents can be triggered by many types of events, including webhooks, scheduled tasks, and background jobs.\"]}]\n44:[\"$\", \"p\", \"7404869afabd\", {\"className\": \"$undefined\", \"children\": [\"One tempting approach is to have each event source call the agent directly, but that has a few failure modes. For example, two events arriving at the same time can start competing runs, and a crash can lose an event entirely.\"]}]\n45:[\"$\", \"p\", \"04436b36fbd5\", {\"className\": \"$undefined\", \"children\": [\"This is where the event inbox comes in. Instead of calling the agent, every source sends an event to an inbox, where a worker picks it up.\"]}]\n46:[\"$\", \"p\", \"e8e19fb3e5d7\", {\"className\": \"$undefined\", \"children\": [\"The simplest version has three components:\"]}]\n47:[\"$\", \"ul\", \"dcdb7b940b64-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"dcdb7b940b64\", {\"children\": [\"A durable list of events, usually a database table;\"]}], [\"$\", \"li\", \"b8e09ea1ce6e\", {\"children\": [\"A handler, usually an HTTP endpoint, that writes events to the list; and\"]}], [\"$\", \"li\", \"9ebc9d978da5\", {\"children\": [\"A worker, usually a background service, that reads from the list.\"]}]]}]\n48:[\"$\", \"p\", \"ea0dd29d0f14\", {\"className\": \"$undefined\", \"children\": [\"The inbox should track the status of each event, and events can be deduplicated based on unique identifiers from the source. A relational database works well for the inbox, with every event appended as a new row. We recommend starting with one inbox per user, but you can split this further if you need more parallelism.\"]}]\n49:[\"$\", \"figure\", \"7bd545394ad8\", {\"style\": {\"--media-natural-width\": \"2040px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/bb08543a505cea3a24c88c718ceec4405e9c0a79.png\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 2040, \"height\": 1821, \"alt\": \"Diagram of the event inbox. A handler (an HTTP endpoint) writes each event to the inbox, a database table that tracks status and drops duplicates, and wakes the worker. The worker reads what’s pending, starts the run, waits for it to finish, and marks the events done.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n4a:[\"$\", \"p\", \"a7c08e15ded6\", {\"className\": \"$undefined\", \"children\": [\"When a new event comes in, the handler writes the event to the inbox and wakes the worker. The worker reads whatever is pending and starts a run. Events that continue earlier work, such as a reply from the user, resume an existing session, while everything else starts a new session.\"]}]\n4b:[\"$\", \"p\", \"91fad8573891\", {\"className\": \"$undefined\", \"children\": [\"From there, the worker passes the events to the agent loop, waits for the run to finish, and marks the corresponding events as done. The implementation details can get tricky, so here are a few best practices:\"]}]\n4c:[\"$\", \"ul\", \"e74edee007aa-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"e74edee007aa\", {\"children\": [[\"$\", \"strong\", \"81b772a2bf19\", {\"children\": [\"The handler should acknowledge events quickly\"]}], \". Some sources, such as webhook providers, treat slow responses as failures. The handler can still run lightweight checks, but any deeper verification, such as checking for prompt injection, should be done during the run.\"]}], [\"$\", \"li\", \"37f8f54365da\", {\"children\": [[\"$\", \"strong\", \"6ccf6778423d\", {\"children\": [\"The inbox should be the source of truth\"]}], \". When the worker is woken up, it should pull the latest events from the inbox first. That way, if the worker dies mid-run, a new one can pick up the same event and retry.\"]}], [\"$\", \"li\", \"57fffb5ad379\", {\"children\": [[\"$\", \"strong\", \"57aa7cf295c2\", {\"children\": [\"An inbox should only have one active worker at a time\"]}], \". This prevents two runs from duplicating work or overwriting each other. When a new event shows up mid-run, you can either push it to the next run, fold it into the current run, or interrupt and restart.\"]}], [\"$\", \"li\", \"418edce52653\", {\"children\": [[\"$\", \"strong\", \"2fae825dbe56\", {\"children\": [\"The worker should batch pending events together.\"]}], \" For example, if the user sends several messages in a row, the worker can merge them into a single run, so the agent only needs to reply once.\"]}]]}]\n4d:[\"$\", \"h3\", \"e1dcecc18f67\", {\"className\": \"$undefined\", \"children\": [\"Timers\"]}]\n4e:[\"$\", \"p\", \"4cf84ca6d1b9\", {\"className\": \"$undefined\", \"children\": [\"Together with the event inbox, timers let always-on agents be proactive. Timers generally fall into one of two categories: follow-ups or schedules. A follow-up is a deadline that the agent sets for itself, such as checking in on a reply. A schedule, on the other hand, is a recurring task that happens on a known cadence, such as a daily newsletter.\"]}]\n4f:[\"$\", \"p\", \"ef78ac429512\", {\"className\": \"$undefined\", \"children\": [\"Timers live in their own durable store, usually another database table, separate from the inbox. The inbox should only hold events that are ready to be worked on. A follow-up and a schedule can share a similar schema, but a schedule needs to track its recurrence as well.\"]}]\n50:[\"$\", \"figure\", \"27182fe1e5cb\", {\"style\": {\"--media-natural-width\": \"1400px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/c16694e6d979a2ace84d03da0544297b7245c0a8.png\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1400, \"height\": 732, \"alt\": \"Diagram of timers. A run sets a timer in a database table, either a follow-up set by the agent or a schedule set by the user. A scheduler finds what’s due and adds an event to the event inbox, which starts the next run.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n51:[\"$\", \"p\", \"c3a719039311\", {\"className\": \"$undefined\", \"children\": [\"A timer doesn’t initiate a run on its own. Instead, a scheduler, usually a background service, polls the store at a fixed interval and fires anything that’s due. On each pass, the scheduler:\"]}]\n52:[\"$\", \"ol\", \"77e7317ae4f2-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"77e7317ae4f2\", {\"children\": [\"Scans the store and finds timers that are due.\"]}], [\"$\", \"li\", \"d837edf355d9\", {\"children\": [\"Updates each timer based on its category.\", [\"$\", \"ol\", \"fa6ba0d95087-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"fa6ba0d95087\", {\"children\": [\"A follow-up should be marked as done.\"]}], [\"$\", \"li\", \"1bd6165be5ee\", {\"children\": [\"A schedule should get its due time updated to the next occurrence.\"]}]]}]]}], [\"$\", \"li\", \"0ff8c6bf4b73\", {\"children\": [\"Adds an event to the inbox and wakes the worker.\"]}]]}]\n53:[\"$\", \"p\", \"9fcdbaa24b49\", {\"className\": \"$undefined\", \"children\": [\"For the scheduler, you can either build your own service or use a durable execution engine.\"]}]\n54:[\"$\", \"h3\", \"d348b5162a5c\", {\"className\": \"$undefined\", \"children\": [\"Memory\"]}]\n55:[\"$\", \"p\", \"f1feca8250f9\", {\"className\": \"$undefined\", \"children\": [\"Always-on agents work across many disjointed runs and rely on memory to maintain continuity.\"]}]\n56:[\"$\", \"p\", \"8e160bc129ff\", {\"className\": \"$undefined\", \"children\": [\"Similar to the event inbox and timers, memory should have its own store. In our products, such as Claude Code’s \", [\"$\", \"$L3f\", \"39aa8d2f5ae3\", {\"value\": {\"_key\": \"925c83effde9\", \"_type\": \"link\", \"href\": \"https://code.claude.com/docs/en/memory\"}, \"children\": [\"auto memory\"]}], \" and the Messages API’s \", [\"$\", \"$L3f\", \"ca94cb3345b2\", {\"value\": {\"_key\": \"28066480cb47\", \"_type\": \"link\", \"href\": \"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"}, \"children\": [\"memory tool\"]}], \", this is implemented as a directory of files. For an always-on agent, the directories should map to durable storage, usually a database or an object store. This way memories outlive the worker.\"]}]\n57:[\"$\", \"p\", \"3ec69354da8d\", {\"className\": \"$undefined\", \"children\": [\"As a rule of thumb, memory should only hold what the agent can’t look up again. If something already lives in another system, such as an issue tracker, you should save a pointer instead. Here is a breakdown of the types of memory an always-on agent should store:\"]}]\n58:[\"$\", \"ul\", \"dcb50b5b1b91-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"dcb50b5b1b91\", {\"children\": [[\"$\", \"strong\", \"fdfaf7456c49\", {\"children\": [\"User instructions:\"]}], \" Any instructions from the user about agent behavior should be saved in their own file and loaded at the start of every run. The user won’t always be around to steer the agent, so the instructions have to carry over between runs.\"]}], [\"$\", \"li\", \"e8d1e9636981\", {\"children\": [[\"$\", \"strong\", \"78f655cfbe78\", {\"children\": [\"User notes:\"]}], \" The agent should save what it’s learned about the user, such as their role, their preferences, or any corrections they’ve given. You can start with one file and move to several small files as the notes grow. In the latter case, only an index is loaded at the start of each run, but the agent can pull the individual files into context when it needs more details.\"]}], [\"$\", \"li\", \"f5f4aead869a\", {\"children\": [[\"$\", \"strong\", \"a15cdffb6bba\", {\"children\": [\"Past messages:\"]}], \" The agent should keep track of what it’s already told the user so nothing is repeated. It can either store this in a separate file that’s loaded at the start of each run, or have the worker load the agent’s last few messages with the user.\"]}], [\"$\", \"li\", \"56db56eb3bad\", {\"children\": [[\"$\", \"strong\", \"7e54e9face4d\", {\"children\": [\"Task progress:\"]}], \" For each ongoing task, the agent should keep a progress file that covers what’s been done and what’s left. Any new run can then read that file and pick up where the previous run left off. Similar to user notes, only an index is loaded at the start of each run, but the agent can pull the individual files into context when it needs more details.\"]}]]}]\n59:[\"$\", \"p\", \"54f9ff6a746d\", {\"className\": \"$undefined\", \"children\": [\"The diagram below shows one example setup.\"]}]\n5a:[\"$\", \"figure\", \"54e958564021\", {\"style\": {\"--media-natural-width\": \"1400px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/e5d209d7ef9b3455dec8a27b777dc12bdf806699.png\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1400, \"height\": 703, \"alt\": \"Diagram of an example memory setup as a directory of files. instructions.md, index.md, and reported.md are loaded at the start of every run, while the notes/ and progress/ folders are read when needed. The agent writes to memory during the run.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n5b:[\"$\", \"p\", \"a281169b48c1\", {\"className\": \"$undefined\", \"children\": [\"All of the above describes memory that’s saved during a run. You can also add dreaming, which reviews past sessions to curate memories. Dreaming can replace outdated entries and find patterns that only show up across many runs. If you’re interested in learning more, our \", [\"$\", \"$L3f\", \"951e648d68f5\", {\"value\": {\"_key\": \"cde9619a8d94\", \"_type\": \"link\", \"href\": \"https://www.anthropic.com/research/components-of-agent-memory\"}, \"children\": [\"post on agent memory\"]}], \" covers this in more detail.\"]}]\n5c:[\"$\", \"h4\", \"a5d88441366e\", {\"className\": \"$undefined\", \"children\": [\"Inside the context window\"]}]\n5d:[\"$\", \"p\", \"6b21227add8c\", {\"className\": \"$undefined\", \"children\": [\"Before doing any work, the agent loads the system prompt, tool definitions, and memory files. This initial context “overhead” is included in every run, so we recommend keeping it lean and using \", [\"$\", \"$L3f\", \"0a3c62a89bf9\", {\"value\": {\"_key\": \"61c53eb52c7c\", \"_type\": \"link\", \"href\": \"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"}, \"children\": [\"prompt caching\"]}], \" to lower costs.\"]}]\n5e:[\"$\", \"p\", \"90a8373866f5\", {\"className\": \"$undefined\", \"children\": [\"A new session starts only with this context overhead and the events that triggered the run. An existing session, on the other hand, brings back the messages and tool calls from its earlier runs.\"]}]\n5f:[\"$\", \"p\", \"5eb18ae1a0f9\", {\"className\": \"$undefined\", \"children\": [\"If a session becomes too long, you can either \", [\"$\", \"$L3f\", \"fe0ae3fc7da5\", {\"value\": {\"_key\": \"c32b4066492a\", \"_type\": \"link\", \"href\": \"https://platform.claude.com/docs/en/build-with-claude/compaction\"}, \"children\": [\"compact the older messages\"]}], \" or start a new session. Both approaches lose detail, so anything that needs to persist should be saved to memory along the way.\"]}]\n60:[\"$\", \"figure\", \"f8920b44bad8\", {\"style\": {\"--media-natural-width\": \"1200px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/48757f0a147acfe841c943674c6214d34ed4405a.gif\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1200, \"height\": 675, \"alt\": \"Animated chart of context used over time. A fixed band for the system prompt, tools, and memory is present on every run. An existing session brings back its whole transcript and grows until compaction turns the older transcript into a summary.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n61:[\"$\", \"h3\", \"e72652cb5a4f\", {\"className\": \"$undefined\", \"children\": [\"Permissions\"]}]\n62:[\"$\", \"p\", \"0b70adf78ab0\", {\"className\": \"$undefined\", \"children\": [\"Permissions are where always-on agents carry the most risk. A run holds the user’s access and, by design, operates unattended. For each tool call, the agent needs to decide whether to proceed on its own, block it, or wait for approval.\"]}]\n63:[\"$\", \"p\", \"9249af893427\", {\"className\": \"$undefined\", \"children\": [\"The components for permissions are the same ones other agents use:\"]}]\n64:[\"$\", \"ul\", \"b8972ba07c2a-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"b8972ba07c2a\", {\"children\": [[\"$\", \"strong\", \"2744b5dcfffb\", {\"children\": [\"Credential store:\"]}], \" Always-on agents often need sensitive user credentials like passwords or access tokens to be useful. The \", [\"$\", \"$L3f\", \"1d3a035c9d7f\", {\"value\": {\"_key\": \"99764f2cbcef\", \"_type\": \"link\", \"href\": \"https://code.claude.com/docs/en/agent-sdk/secure-deployment#credential-management\"}, \"children\": [\"recommended pattern\"]}], \" is a proxy outside the agent’s environment that adds credentials to outgoing requests. The agent sends requests without credentials, and the proxy injects the real credentials before forwarding.\"]}], [\"$\", \"li\", \"7f9445d22f1b\", {\"children\": [[\"$\", \"strong\", \"e5562a135fe0\", {\"children\": [\"Auto mode:\"]}], \" An always-on agent should be able to work without constant user input. We’ve already tackled a version of this problem with \", [\"$\", \"$L3f\", \"2221d5bcc3ca\", {\"value\": {\"_key\": \"14c2862488a5\", \"_type\": \"link\", \"href\": \"https://www.anthropic.com/research/claude-code-auto-mode\"}, \"children\": [\"auto mode\"]}], \" in Claude Code. Auto mode uses classifiers to review higher-risk actions and block the ones they identify as dangerous so Claude can find a safer approach. User review, however, is still necessary for the most important decisions.\"]}], [\"$\", \"li\", \"2c8f97b7a09b\", {\"children\": [[\"$\", \"strong\", \"8a7e28ebc5e0\", {\"children\": [\"Deferred tool calls:\"]}], \" In Claude Code, \", [\"$\", \"$L3f\", \"6688b01f1559\", {\"value\": {\"_key\": \"7e766caa2af3\", \"_type\": \"link\", \"href\": \"https://code.claude.com/docs/en/hooks#defer-a-tool-call-for-later\"}, \"children\": [\"a hook can defer a tool call\"]}], \" and wait for additional input from the user. The same pattern applies to always-on agents, which may need clarification or approval before taking certain actions. When a call is deferred, the run ends and the session is saved mid-call. The request is shown to the user (e.g., through an interactive card built with \", [\"$\", \"$L3f\", \"440423826ad3\", {\"value\": {\"_key\": \"1a89883d9772\", \"_type\": \"link\", \"href\": \"https://modelcontextprotocol.io/extensions/apps/overview\"}, \"children\": [\"MCP Apps\"]}], \"), and their answer comes back as an event in the inbox. That event starts a new run, which resumes the saved session with the user’s input. While the deferred call waits for a response, the worker can pick up other events, so the agent isn’t blocked.\"]}]]}]\n65:[\"$\", \"h3\", \"7b7a3f8a182a\", {\"className\": \"$undefined\", \"children\": [\"Outbox\"]}]\n66:[\"$\", \"p\", \"8d9a129f8e6c\", {\"className\": \"$undefined\", \"children\": [\"With most AI agents, the response is streamed to the user as it’s generated, so they can follow along as Claude reasons through the problem, calls tools, and writes its answer.\"]}]\n67:[\"$\", \"p\", \"e1afed6a7dab\", {\"className\": \"$undefined\", \"children\": [\"Always-on agents, on the other hand, do most of their work in the background. The user gets the outcome and a few details, rather than the entire step-by-step breakdown.\"]}]\n68:[\"$\", \"figure\", \"39ed726401f9\", {\"style\": {\"--media-natural-width\": \"1506px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/700b5f3a446f22493c0307ec65751b6b2f82ccb7.png\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1506, \"height\": 739, \"alt\": \"Diagram of the outbox. A run ends with nothing to say, a send tool call, or a deferred tool call that asks the user. Messages go to the outbox, a database table, and a dispatcher delivers them to the user. A deferred request can go through the outbox or be shown in your own interface.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n69:[\"$\", \"p\", \"e1c4f40c1fb2\", {\"className\": \"$undefined\", \"children\": [\"A run can end in one of three ways:\"]}]\n6a:[\"$\", \"ul\", \"f199435e6e7c-parent\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"li\", \"f199435e6e7c\", {\"children\": [\"The agent sends a message to the outbox,\"]}], [\"$\", \"li\", \"53e1bdd03077\", {\"children\": [\"The agent decides that nothing needs to be sent, or\"]}], [\"$\", \"li\", \"cead71478ca4\", {\"children\": [\"The agent uses a deferred tool call to request permission or additional input.\"]}]]}]\n6b:[\"$\", \"p\", \"aa0f83fafbb3\", {\"className\": \"$undefined\", \"children\": [\"Most always-on agents can get by with a “send” tool that delivers the message directly to the user. You only need a formal outbox when you want to pace your agent’s messages or allow your agent to recover from errors.\"]}]\n6c:[\"$\", \"p\", \"be46caf319e4\", {\"className\": \"$undefined\", \"children\": [\"The outbox is a separate table of outgoing messages, analogous to the event inbox. There’s also a dispatcher, usually a background service, that’s analogous to the worker. The dispatcher reads the pending messages, decides what to deliver, and sends those to the user. A request from a deferred tool call can either go through the outbox or be shown directly in the interface.\"]}]\n6d:[\"$\", \"p\", \"fd429a72bdf2\", {\"className\": \"$undefined\", \"children\": [\"Beyond delivery, it’s important to tune how many messages the agent sends. An agent that sends too many becomes noisy, while an agent that doesn’t send enough misses things that the user needs to know. We recommend building evals to find the right balance. In practice, it’s better for the agent to start quiet and then earn more of the user’s attention over time.\"]}]\n6e:[\"$\", \"h2\", \"2e45f074ce86\", {\"className\": \"$undefined\", \"id\": \"how-everything-fits-together\", \"children\": [\"How everything fits together\"]}]\n6f:[\"$\", \"p\", \"e5f6aae1e768\", {\"className\": \"$undefined\", \"children\": [\"Here is how the five primitives fit together:\"]}]\n70:[\"$\", \"figure\", \"f26b9d1f6596\", {\"style\": {\"--media-natural-width\": \"1200px\"}, \"data-flush\": \"$undefined\", \"children\": [[\"$\", \"img\", null, {\"referrerPolicy\": \"strict-origin-when-cross-origin\", \"src\": \"https://assets.claude.com/9f8df7b2dcc9d4637d27f37dae6e40a2a5851c8a.gif\", \"srcSet\": \"$undefined\", \"sizes\": \"$undefined\", \"width\": 1200, \"height\": 675, \"alt\": \"Animated diagram of how the five primitives fit together. Timers and the event inbox start a run, the run works with memory and permissions inside a session, and the outbox delivers messages to the user, whose answer comes back as an event.\", \"loading\": \"lazy\", \"fetchPriority\": \"$undefined\", \"decoding\": \"async\", \"className\": \"Media-module-scss-module__7ZZCyW__image\", \"style\": \"$undefined\"}], null]}]\n71:[\"$\", \"p\", \"a7e9c65737e9\", {\"className\": \"$undefined\", \"children\": [\"Every run starts with an event from the inbox, whether it’s a user message, a webhook, or a timer. When the worker picks up an event, it kicks off a run and wakes the agent in a new or existing session. The agent reads its memory to get a baseline, works within its permissions to take actions, and then updates its memory with anything it has learned. Once the run is finished, the agent pushes a row to the outbox, and the dispatcher delivers the message to the user.\"]}]\n72:[\"$\", \"p\", \"5e4857f63ccc\", {\"className\": \"$undefined\", \"children\": [\"Together, these form a cycle. A run can set a timer that wakes the agent again later, and when the user replies to a message, their answer comes back as an event in the inbox. Each run is brief, but the cycle keeps going indefinitely, and that’s what makes the agent feel like it’s always on.\"]}]\n73:[\"$\", \"h2\", \"8957fec26e7a\", {\"className\": \"$undefined\", \"id\": \"acknowledgements\", \"children\": [\"Acknowledgements\"]}]\n74:[\"$\", \"p\", \"dba3b38c0505\", {\"className\": \"$undefined\", \"children\": [[\"$\", \"em\", \"3c609c9c08c8\", {\"children\": [\"Written by William Hu. Special thanks to Rodrigo Olivares and Michael Segner for their contributions.\"]}]]}]\n"])</script>
